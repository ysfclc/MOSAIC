org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP 2.2.x registers generated Kotlin sources through Kotlin source sets.
# AGP 9 built-in Kotlin currently rejects that integration path; keep the
# compatibility gate disabled until KSP exposes the Android sourceSets path.
android.disallowKotlinSourceSets=false
